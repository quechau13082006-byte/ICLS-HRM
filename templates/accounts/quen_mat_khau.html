{% extends 'base.html' %}
{% block auth_content %}
  <h3 class="mb-3">Quên mật khẩu</h3>
  <p class="text-muted">Nhập email đã đăng ký, hệ thống sẽ gửi đường dẫn đặt lại mật khẩu (hiệu lực 24 giờ).</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include 'core/_truong_form.html' with truong=form.email %}
    <button class="btn btn-icls w-100">Gửi yêu cầu</button>
  </form>
  <p class="mt-3 text-center"><a href="{% url 'accounts:login' %}">Quay lại đăng nhập</a></p>
{% endblock %}
