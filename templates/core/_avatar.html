{% load icls_filters %}{# Ảnh đại diện nhân sự (thẻ "avatar" trong icls_filters): có ảnh thì hiện ảnh, chưa có thì chữ cái đầu #}{% if anh %}<img class="avatar-initials avatar-anh {{ co }}" src="{% url 'core:tai_file' anh %}" alt="" title="{{ nv.full_name }}" loading="lazy">{% else %}<span class="avatar-initials {{ co }} {{ nv.pk|default:0|mau_avatar }}" title="{{ nv.full_name }}">{{ chu }}</span>{% endif %}
